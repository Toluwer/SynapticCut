<body>

<div id="sc-root">
<div id="tooltip"><span class="tt-t"></span><span class="tt-k"></span></div>
<div id="menu-pop"></div>

<!-- ================= PROJECT LAUNCHER ================= -->
<div id="launcher">
  <div class="lc-card">
    <div class="lc-head">
      <div class="lc-logo">SC</div>
      <div>
        <h1>SynapticCut</h1>
        <div class="lc-sub">Professional video editing workstation</div>
      </div>
    </div>
    <div class="lc-actions">
      <button class="lc-new" id="btn-new">New Project…</button>
      <button class="lc-open" id="btn-open">Open Project…</button>
    </div>
    <div class="lc-sec">Recent Projects</div>
    <div class="lc-list" id="lc-recent-list"></div>
    <div class="lc-foot">
      <span>Runs entirely in this browser · nothing is uploaded</span>
      <span class="lk" id="lk-settings" data-tip="Project Settings">Settings…</span>
      <span class="lk" id="lk-keys" data-tip="Keyboard Shortcuts">Keyboard Shortcuts…</span>
      <span class="ver">0.1.0 · Milestone 1</span>
    </div>
  </div>
</div>

<!-- ================= MAIN WORKSTATION ================= -->
<div id="app" class="hide">

  <header id="topbar">
    <button class="icb" id="btn-home" data-tip="Project Launcher" data-key="Shift+H">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2.5 7.5 8 3l5.5 4.5M4.2 6.8V13h7.6V6.8"/></svg>
    </button>
    <div class="logo-sq">SC</div>
    <nav id="menubar" style="display:flex;gap:1px;margin-left:4px">
      <button class="menu-btn" data-menu="file">File</button>
      <button class="menu-btn" data-menu="edit">Edit</button>
      <button class="menu-btn" data-menu="clip">Clip</button>
      <button class="menu-btn" data-menu="sequence">Sequence</button>
      <button class="menu-btn" data-menu="effects">Effects</button>
      <button class="menu-btn" data-menu="view">View</button>
      <button class="menu-btn" data-menu="window">Window</button>
      <button class="menu-btn" data-menu="help">Help</button>
    </nav>
    <div class="tb-mid">
      <div id="tb-project"><b id="tb-proj-name">—</b> · <span id="tb-seq-path">—</span></div>
    </div>
    <div class="tb-right">
      <div id="ws-tabs">
        <button class="ws-tab on" data-ws="editing">Editing</button>
        <button class="ws-tab" data-ws="effects">Effects</button>
        <button class="ws-tab" data-ws="audio">Audio</button>
        <button class="ws-tab" data-ws="color">Color</button>
      </div>
      <span class="vsep"></span>
      <div id="save-status"><b>Saved</b> · Auto-save 14:32</div>
    </div>
  </header>

  <div id="toolbar">
    <button class="tool on" data-tool="select" data-tip="Selection Tool" data-key="V">
      <svg width="15" height="15" viewBox="0 0 16 16"><path d="M4 1.5v11l2.7-2.5 1.8 4.1 1.6-.8-1.8-4 3.8-.3z" fill="currentColor"/></svg>
    </button>
    <button class="tool" data-tool="track" data-tip="Track Select Forward" data-key="A">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 8h6.5M6 4.5 9.5 8 6 11.5"/><rect x="11.5" y="2.5" width="2" height="11" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="tool" data-tool="razor" data-tip="Razor Tool" data-key="C">
      <svg width="15" height="15" viewBox="0 0 16 16"><path d="M2.4 13.6 10.6 5.4l1.9 1.9-8.2 8.2-2.5.7z" fill="currentColor"/><circle cx="12.9" cy="3.1" r="1" fill="currentColor"/></svg>
    </button>
    <button class="tool" data-tool="ripple" data-tip="Ripple Edit Tool" data-key="B">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2.5 4v8M13.5 4v8M4.5 8h6M8 5.2 10.8 8 8 10.8"/></svg>
    </button>
    <button class="tool" data-tool="slip" data-tip="Slip Tool" data-key="Y">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="4.5" y="5" width="7" height="6"/><path d="M2 8h1.2M12.8 8H14M6 8h4M7.2 6.8 6 8l1.2 1.2M8.8 6.8 10 8l-1.2 1.2"/></svg>
    </button>
    <button class="tool" data-tool="pen" data-tip="Pen Tool" data-key="P">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8 2.2c2.3 2.6 3.3 4.9 2.8 7L8 12.2 5.2 9.2c-.5-2.1.5-4.4 2.8-7z"/><circle cx="8" cy="9" r="1.1"/><path d="M8 12.4V15"/></svg>
    </button>
    <button class="tool" data-tool="hand" data-tip="Hand Tool" data-key="H">
      <svg width="15" height="15" viewBox="0 0 16 16"><path d="M3.2 13V8.3c0-.5.8-.5.8 0v3h.5V5.4c0-.6.9-.6.9 0v5h.5V4.3c0-.6.9-.6.9 0V10h.5V5.7c0-.6.9-.6.9 0v4.9c0 1.5-.5 2.2-1.2 2.9l-.4.5z" fill="currentColor"/></svg>
    </button>
    <button class="tool" data-tool="type" data-tip="Type Tool" data-key="T">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3.5 3.5h9M8 3.5V13M6.2 13h3.6"/></svg>
    </button>
    <button class="tool" data-tool="zoom" data-tip="Zoom Tool" data-key="Z">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="6.8" cy="6.8" r="4.3"/><path d="M10.1 10.1 14 14M5 6.8h3.6M6.8 5v3.6"/></svg>
    </button>
    <span class="vsep"></span>
    <button class="icb" id="tb-snap" data-tip="Snap" data-key="S">
      <svg width="15" height="15" viewBox="0 0 16 16"><path d="M4 2.6h2.8v5a1.2 1.2 0 0 0 2.4 0v-5H12v5.4a4 4 0 0 1-8 0zM4 5h2.8M9.2 5H12" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
    </button>
    <span class="tb-note">Tool: <span id="tool-note">Selection</span></span>
  </div>

  <main id="workarea">
    <section class="ws on" id="ws-editing">
      <div class="layout">
        <div class="slot" id="slot-e-bin" style="grid-area:a-bin"></div>
        <div class="slot" id="slot-e-mon" style="grid-area:a-mon"></div>
        <div class="slot" id="slot-e-props" style="grid-area:a-props"></div>
        <div class="slot" id="slot-e-tl" style="grid-area:a-tl"></div>
      </div>
    </section>
    <section class="ws" id="ws-effects">
      <div class="layout">
        <div class="slot" id="slot-f-mon" style="grid-area:b-mon"></div>
        <div class="slot" id="slot-f-fx" style="grid-area:b-fx"></div>
        <div class="slot" id="slot-f-ec" style="grid-area:b-ec"></div>
        <div class="slot" id="slot-f-tl" style="grid-area:b-tl"></div>
      </div>
    </section>
    <section class="ws" id="ws-audio">
      <div class="layout">
        <div class="slot" id="slot-a-mon" style="grid-area:c-mon"></div>
        <div class="slot" id="slot-a-mix" style="grid-area:c-mix"></div>
        <div class="slot" id="slot-a-tl" style="grid-area:c-tl"></div>
      </div>
    </section>
    <section class="ws" id="ws-color">
      <div class="layout">
        <div class="slot" id="slot-c-mon" style="grid-area:d-mon"></div>
        <div class="slot" id="slot-c-col" style="grid-area:d-col"></div>
        <div class="slot" id="slot-c-tl" style="grid-area:d-tl"></div>
      </div>
    </section>
  </main>

  <footer id="statusbar">
    <div id="status-left">
      <span>SynapticCut Engine · Canvas Compositor · WebAudio</span>
      <span class="sb-sep"></span>
      <span id="sb-seq">No sequence</span>
      <span id="status-action"></span>
    </div>
    <div id="status-right">
      <span id="sb-sel">No selection</span>
    </div>
  </footer>
</div>

<!-- ================= DIALOG / DRAG GHOST / HIDDEN INPUTS ================= -->
<div id="modal-ov"><div class="scm-card" id="modal-card"></div></div>
<div id="drag-ghost"><span class="tchip"></span><span class="dg-name"></span></div>
<input type="file" id="file-import" class="hide" multiple="multiple" accept="video/*,audio/*,image/*">
<input type="file" id="file-open" class="hide" accept=".json,application/json">
<input type="file" id="file-relink" class="hide" accept="video/*,audio/*,image/*">

<!-- ================= PANEL STORE ================= -->
<div id="panel-store" class="hide">
