/* ================= TOOLTIPS ================= */
let ttEl=null,ttTimer=null;
document.addEventListener('mouseover',e=>{
  const t=e.target.closest('[data-tip]');
  if(t===ttEl)return;
  clearTimeout(ttTimer);hideTip();
  if(!t)return;
  ttEl=t;
  ttTimer=setTimeout(()=>{
    const tip=$('#tooltip');
    tip.querySelector('.tt-t').textContent=t.dataset.tip;
    const k=t.dataset.key;
    tip.querySelector('.tt-k').textContent=k||'';
    tip.querySelector('.tt-k').style.display=k?'':'none';
    tip.classList.add('show');
    const r=t.getBoundingClientRect(),tr=tip.getBoundingClientRect();
    let x=r.left+r.width/2-tr.width/2;
    x=Math.max(6,Math.min(x,innerWidth-tr.width-6));
    let y=r.top-tr.height-7;
    if(y<44)y=r.bottom+7;
    tip.style.left=x+'px';tip.style.top=y+'px';
  },300);
});
document.addEventListener('mousedown',hideTip);
function hideTip(){clearTimeout(ttTimer);$('#tooltip').classList.remove('show');ttEl=null;}

const POP=$('#menu-pop');
function openMenu(anchor,items,x,y){
  POP.innerHTML='';
  items.forEach(it=>{
    if(it.sep){const d=document.createElement('div');d.style.cssText='height:1px;background:#33383d;margin:3px 8px';POP.appendChild(d);return;}
    const r=document.createElement('div');r.className='mi'+(it.dis?' dis':'');
    let chk='';
    if(it.chk){const on=it.chk();r.innerHTML=`<span class="mi-chk">${on?'✓':''}</span>`;}
    r.innerHTML+=`<span>${it.t}</span>`+
      (it.k?`<span class="mi-k">${it.k}</span>`:'')+
      (it.sub?`<span class="mi-sub">▶</span>`:'');
    r.addEventListener('click',()=>{if(it.act)it.act();closeMenu();});
    POP.appendChild(r);
  });
  POP.classList.add('show');
  const pr=anchor?anchor.getBoundingClientRect():{left:x,top:y,bottom:y};
  let px=x!==undefined?x:pr.left, py=y!==undefined?y:pr.bottom+3;
  if(px+POP.offsetWidth>innerWidth-8)px=Math.max(8,px-POP.offsetWidth);
  if(py+POP.offsetHeight>innerHeight-8)py=Math.max(8,py-POP.offsetHeight-20);
  POP.style.left=px+'px';POP.style.top=py+'px';
}
function closeMenu(){POP.classList.remove('show');$$('.menu-btn.open').forEach(b=>b.classList.remove('open'));}
document.addEventListener('mousedown',e=>{
  if(POP.contains(e.target))return;
  if(e.target.closest('.menu-btn,.mres,.icb,.tbtn')&&POP.classList.contains('show'))return;
  closeMenu();
});

function buildTree(){
  const tr=$('#tree');tr.innerHTML='';
  TREE.forEach(nd=>{
    const row=document.createElement('div');
    row.className='tree-row'+(nd.open?' open':'')+(S.folder===nd.id?' sel':'');
    row.dataset.id=nd.id;
    row.style.paddingLeft=(2)+'px';
    row.innerHTML=`<span class="car"><i></i></span><span class="tn2">${nd.n}</span><span class="tc2">${nd.c}</span>`;
    row.addEventListener('click',()=>{
      S.folder=nd.id;S.search='';$('#bin-search').value='';
      nd.open=1;buildTree();renderBin();
    });
    tr.appendChild(row);
    if(nd.open&&nd.ch){
      nd.ch.forEach(c=>{
        const r2=document.createElement('div');
        r2.className='tree-row'+(S.folder===c.id?' sel':'');
        r2.dataset.id=c.id;r2.style.paddingLeft='20px';
        r2.innerHTML=`<span class="car"><i></i></span><span class="tn2">${c.n}</span><span class="tc2">${c.c}</span>`;
        r2.addEventListener('click',()=>{S.folder=c.id;S.search='';$('#bin-search').value='';buildTree();renderBin();});
        tr.appendChild(r2);
      });
    }
  });
}
const FOLNAME={footage:'Footage',interviews:'Footage / Interviews',broll:'Footage / B-Roll',drone:'Footage / Drone',
  audio:'Audio',vo:'Audio / Voiceover',amb:'Audio / Ambience',mus:'Audio / Music',
  graphics:'Graphics',titles:'Graphics / Titles',logos:'Graphics / Logos',sequences:'Sequences'};
function folderAssets(){
  if(S.folder==='footage')return ASSETS.filter(a=>['interviews','broll','drone'].includes(a.f));
  if(S.folder==='audio')return ASSETS.filter(a=>['vo','amb','mus'].includes(a.f));
  if(S.folder==='graphics')return ASSETS.filter(a=>['titles','logos'].includes(a.f));
  return ASSETS.filter(a=>a.f===S.folder);
}
function renderBin(){
  let list=folderAssets();
  if(S.search){const q=S.search.toLowerCase();list=ASSETS.filter(a=>a.n.toLowerCase().includes(q));}
  const {k,d}=S.sort;
  list=[...list].sort((a,b)=>{
    let va,vb;
    if(k==='name'){va=a.n;vb=b.n;return va.localeCompare(vb)*d;}
    if(k==='type'){va=a.ty;vb=b.ty;return va.localeCompare(vb)*d;}
    if(k==='dur'){return (a.ds-b.ds)*d;}
    if(k==='fmt'){va=a.fmt;vb=b.fmt;return va.localeCompare(vb)*d;}
    va=a.st;vb=b.st;return va.localeCompare(vb)*d;
  });
  $('#bin-path').textContent=S.search?'Search: "'+S.search+'"':(FOLNAME[S.folder]||S.folder);
  $('#bin-count').textContent=list.length+' item'+(list.length===1?'':'s');
  const wrap=$('#bin-rows');wrap.innerHTML='';
  if(!list.length){wrap.innerHTML='<div class="bin-empty">No matching media in this location.</div>';}
  list.forEach(a=>{
    const r=document.createElement('div');
    r.className='bin-row'+(a.n===S.selAsset?' sel':'');
    r.innerHTML=
      `<span class="bn"><span class="tchip">${TYCH[a.ty]}</span><span>${a.n}</span></span>`+
      `<span class="bd">${a.ty}</span>`+
      `<span class="bd">${a.dur}</span>`+
      `<span class="bf">${a.fmt}</span>`+
      `<span><span class="badge ${a.st}">${STLBL[a.st]}</span></span>`;
    r.addEventListener('click',()=>{S.selAsset=a.n;renderBin();});
    r.addEventListener('dblclick',()=>{action('Opening '+a.n+' in Source monitor');
      $$('#mon-tabs .mtab').forEach(x=>x.classList.toggle('on',x.dataset.src==='source'));
      $('#mon-stage').classList.remove('src');
      $('.src-empty .se-t').textContent=a.n;});
    r.addEventListener('contextmenu',e=>{e.preventDefault();S.selAsset=a.n;renderBin();
      openMenu(null,CTX.asset,Math.min(e.clientX,innerWidth-210),e.clientY);});
    wrap.appendChild(r);
  });
}
$$('#bin-head .th').forEach(h=>h.addEventListener('click',()=>{
  const k=h.dataset.k;
  if(S.sort.k===k)S.sort.d*=-1;else S.sort={k,d:1};
  $$('#bin-head .th').forEach(x=>{x.classList.remove('asc','desc');
    if(x.dataset.k===S.sort.k)x.classList.add(S.sort.d===1?'asc':'desc');});
  renderBin();
}));
$('#bin-search-ic').addEventListener('click',()=>{
  const w=$('#bin-searchwrap');w.classList.toggle('open');
  if(w.classList.contains('open'))$('#bin-search').focus();
  else{S.search='';$('#bin-search').value='';renderBin();}
});
$('#bin-search').addEventListener('input',e=>{S.search=e.target.value.trim();renderBin();});

/* ================= EFFECTS BROWSER ================= */
function buildFx(){
  const body=$('#fx-body');body.innerHTML='';
  const q=S.fxSearch.toLowerCase();
  FXG.forEach(g=>{
    const items=q?g.items.filter(i=>i.toLowerCase().includes(q)):g.items;
    if(q&&!items.length)return;
    const gx=document.createElement('div');
    gx.className='fxg'+((g.open&&!q)?' open':'');
    gx.innerHTML=`<div class="fxg-h"><span class="car"><i></i></span>${g.n}<span class="cnt">${items.length}</span></div><div class="fxg-rows"></div>`;
    gx.querySelector('.fxg-h').addEventListener('click',()=>gx.classList.toggle('open'));
    const rows=gx.querySelector('.fxg-rows');
    items.forEach(nm=>{
      const r=document.createElement('div');
      r.className='fxr'+(nm===S.fxSel?' sel':'');
      r.innerHTML=`<span class="fxc${g.k==='aud'?' aud':''}">${g.k==='aud'?'∿':'fx'}</span><span>${nm}</span><span class="grip"><i></i><i></i><i></i></span>`;
      r.addEventListener('click',()=>{S.fxSel=nm;buildFx();});
      r.addEventListener('dblclick',()=>action(nm+' applied to Interview_Marta_Closeup'));
      r.addEventListener('contextmenu',e=>{e.preventDefault();
        openMenu(null,CTX.fx,Math.min(e.clientX,innerWidth-210),e.clientY);});
      rows.appendChild(r);
    });
    body.appendChild(gx);
  });
  if(!body.children.length)body.innerHTML='<div class="bin-empty">No effects match the search.</div>';
}
$('#fx-search').addEventListener('input',e=>{S.fxSearch=e.target.value.trim();buildFx();});

/* ================= AUDIO MIXER ================= */
function buildMixer(){
  const body=$('#mix-body');body.innerHTML='';
  const scale=document.createElement('div');scale.className='mix-scale';
  ['+6','0','-12','-24','-48','-∞'].forEach(t=>{
    const s=document.createElement('span');s.textContent=t;scale.appendChild(s);});
  body.appendChild(scale);
  const stripWrap=document.createElement('div');stripWrap.className='mix-strips';
  MIX.forEach(m=>{
    const st=document.createElement('div');st.className='strip'+(m.master?' master':'');
    const peak=Math.min(97,m.lv+3);
    const topPct=(6-m.db)/66*100;
    st.innerHTML=`
      <div class="strip-nm">${m.n}</div>
      <div class="strip-id">${m.master?'MASTER':m.id+' · '+m.n}</div>
      <div class="strip-mid">
        <div class="meter"><div class="mb"><i style="height:${m.lv}%"></i><span class="peak" style="bottom:${peak}%"></span></div><div class="mb"><i style="height:${Math.max(4,m.lv-6)}%"></i><span class="peak" style="bottom:${Math.max(4,peak-6)}%"></span></div></div>
        <div class="faderwrap"><div class="fader"><span class="th" style="top:calc(${topPct}% - 7px)"></span></div></div>
      </div>
      <div class="strip-db">${m.db>0?'+':''}${m.db.toFixed(1)} dB</div>
      ${m.master
        ?`<div class="strip-btns"><span class="sbtn" style="width:46px" data-tip="Master Output">OUTPUT</span></div>`
        :`<div class="strip-btns">
            <button class="sbtn m" data-tip="Mute ${m.id}">M</button>
            <button class="sbtn s${m.ms==='s'?' on s':''}" data-tip="Solo ${m.id}">S</button>
          </div>`}`;
    st.querySelectorAll('.sbtn').forEach(b=>b.addEventListener('click',()=>{
      if(b.classList.contains('on')&&b.textContent!=='OUTPUT')b.classList.remove('on');
      else if(b.textContent!=='OUTPUT')b.classList.add('on');
    }));
    stripWrap.appendChild(st);
  });
  body.appendChild(stripWrap);
}

/* ================= TIMELINE ================= */
function buildTracks(){
  const hd=$('#tl-headers'),tk=$('#tl-tracks');
  hd.innerHTML='<div class="th-sp"></div>';tk.innerHTML='';
  TRACKS.forEach(tr=>{
    const hr=document.createElement('div');
    hr.className='hrow '+tr.t+(tr.t==='a'&&tr.id==='A1'?' first':'');
    hr.style.height=tr.h+'px';hr.dataset.track=tr.id;
    hr.innerHTML=`<span class="tn">${tr.id}</span><span class="tn2">${tr.name}</span><span class="sp"></span>`+
      (tr.t==='v'
        ?`<button class="thb on" data-a="eye" data-tip="Toggle Track Output">${IC.eye}</button>`
        :`<button class="thb on" data-a="mute" data-tip="Mute Track">${IC.spk}</button><button class="thb" data-a="solo" data-tip="Solo Track"><span class="bl">S</span></button>`)+
      `<button class="thb" data-a="lock" data-tip="Lock Track">${IC.lock}</button>`;
    hr.querySelectorAll('.thb').forEach(b=>b.addEventListener('click',()=>{
      const a=b.dataset.a;
      if(a==='lock'){b.classList.toggle('on');b.classList.toggle('warn');}
      else if(a==='solo'){b.classList.toggle('on');}
      else{b.classList.toggle('on');}
    }));
    hr.addEventListener('contextmenu',e=>{e.preventDefault();
      openMenu(null,CTX.track,Math.min(e.clientX,innerWidth-210),e.clientY);});
    hd.appendChild(hr);

    const td=document.createElement('div');
    td.className='track '+tr.t+(tr.t==='a'&&tr.id==='A1'?' first':'');
    td.style.height=tr.h+'px';td.dataset.track=tr.id;
    td.addEventListener('contextmenu',e=>{
      if(e.target.closest('.clip'))return;
      e.preventDefault();
      openMenu(null,CTX.tlempty,Math.min(e.clientX,innerWidth-210),e.clientY);});
    tk.appendChild(td);
  });
}
function waveSVG(c,w,h){
  const r=mul32(c.s*97+c.d*31+c.n.length*13);
  const n=Math.max(10,Math.floor(w/3));
  const top=[],bot=[];
  for(let i=0;i<=n;i++){
    const t=i/n;
    const env=(Math.sin(t*Math.PI)*.75+.25)*(0.55+.45*Math.sin(t*9+c.n.length));
    let a=r()*env;
    top.push((h/2-a*(h/2-2)).toFixed(1));
    bot.push((h/2+a*(h/2-2)*(0.55+.45*r())).toFixed(1));
  }
  let pts='M0,'+(h/2);
  top.forEach((y,i)=>pts+=' L'+(i*(w/n)).toFixed(1)+','+y);
  bot.reverse().forEach((y,i)=>{const x=((n-i)*(w/n)).toFixed(1);pts+=' L'+x+','+y;});
  pts+=' Z';
  return `<svg class="wv" viewBox="0 0 ${Math.round(w)} ${h}" preserveAspectRatio="none"><path d="${pts}" fill="rgba(127,182,148,.34)" stroke="rgba(127,182,148,.75)" stroke-width="1"/></svg>`;
}
function renderTL(){
  const pps=S.zoom;
  const W=SEQ.dur*pps+80;
  $('#tl-content').style.width=W+'px';
  const ru=$('#tl-ruler');ru.innerHTML='';
  const step=pps>=40?1:pps>=18?2:pps>=9?5:pps>=5?10:15;
  for(let t=0;t<=SEQ.dur;t++){
    const x=Math.round(t*pps)+.5;
    const el=document.createElement('div');
    el.className='tick'+(t%step===0?' maj':'');
    el.style.left=x+'px';ru.appendChild(el);
    if(t%step===0){
      const lb=document.createElement('div');
      lb.className='tlabel';lb.style.left=x+'px';lb.textContent=fmtShort(t);
      ru.appendChild(lb);
    }
  }
  MARKERS.forEach(m=>{
    const el=document.createElement('div');el.className='tmark';
    el.style.left=(m.t*pps-3)+'px';el.dataset.tip='Marker: '+m.n;
    ru.appendChild(el);
  });
  $$('#tl-tracks .track').forEach(t=>t.querySelectorAll('.clip,.tl-empty-hint').forEach(c=>c.remove()));
  CLIPS.forEach(c=>{
    const track=$('#tl-tracks .track[data-track="'+c.t+'"]');if(!track)return;
    const el=document.createElement('div');
    el.className='clip '+(c.t[0]==='V'?'v':'a')+(c.n===S.selClip?' sel':'');
    el.style.left=(c.s*pps)+'px';
    const wpx=Math.max(8,c.d*pps-1);
    el.style.width=wpx+'px';
    el.innerHTML=`<span class="cn">${c.n}</span>`;
    if(c.fx)el.innerHTML+=`<span class="fxd">fx</span>`;
    if(c.t[0]==='A')el.innerHTML+=waveSVG(c,wpx-2,Math.max(10,track.clientHeight-16));
    el.addEventListener('click',e=>{e.stopPropagation();S.selClip=c.n;renderTL();
      $('#status-right').innerHTML=`<span>${c.t} · <span style="color:var(--txt-2)">${c.n}</span></span><span class="sb-sep"></span><span>In ${fmtTC(c.s)} · Out ${fmtTC(c.s+c.d)}</span>`;});
    el.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();
      S.selClip=c.n;renderTL();
      openMenu(null,CTX.clip,Math.min(e.clientX,innerWidth-210),e.clientY);});
    track.appendChild(el);
  });
  $('#tl-ph').style.left=(37.58*pps)+'px';
}
$('#tl-zoom').addEventListener('input',e=>{S.zoom=+e.target.value;renderTL();});
$('#tl-zo').addEventListener('click',()=>{setZoom(S.zoom-3)});
$('#tl-zi').addEventListener('click',()=>{setZoom(S.zoom+3)});
function setZoom(v){v=Math.max(4,Math.min(48,v));S.zoom=Math.round(v);$('#tl-zoom').value=S.zoom;renderTL();}

    requestAnimationFrame(()=>$('#app').classList.remove('fade'));},220);
  renderTL();
}

    requestAnimationFrame(()=>$('#launcher').classList.remove('fade'));},220);
}

  $('#save-status').innerHTML=`<b>Saved</b> · Auto-save ${hh}:${mm}`;
}
