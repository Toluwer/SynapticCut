<script>
"use strict";
/* =====================================================================
   SynapticCut - 11 UI BIN (M3): recursive folder tree with context menus,
   inline rename, drag-asset-to-bin, filter chips, search (name + file
   name), sort, view-state persistence, import wiring, drag-to-timeline
   ===================================================================== */
const Bin={
  TYLBL:{video:'Movie',audio:'Audio',image:'Graphics',matte:'Matte',bars:'Bars',tone:'Tone',sequence:'Sequence'},
  TYCH:{video:'M',audio:'A',image:'G',matte:'G',bars:'G',tone:'A',sequence:'S'},
  FILTERS:[['all','All'],['video','Movies'],['audio','Audio'],['still','Stills']],
  PREFKEY:'synapticcut.uiprefs',
  _importTarget:null,

  fmtOf(a){
    if(a.kind==='video')return (a.meta.width||'?')+'×'+(a.meta.height||'?')+(a.meta.fps?' · '+a.meta.fps+'p':'');
    if(a.kind==='image')return (a.meta.width||'?')+'×'+(a.meta.height||'?')+' · Image';
    if(a.kind==='matte')return '1920×1080 · Matte';
    if(a.kind==='bars')return '1920×1080 · Bars';
    if(a.kind==='audio'||a.kind==='tone')return (a.meta.sampleRate||48000)+' Hz · '+(a.meta.channels===1?'Mono':'Stereo');
    if(a.kind==='sequence')return (a.meta.width||'?')+'×'+(a.meta.height||'?')+(a.meta.fps?' · '+a.meta.fps+'p':'');
    return '';
  },
  statusOf(a){
    if(a.kind==='sequence')return{cls:'acc',lbl:'Sequence'};
    if(a.offline)return{cls:'bad',lbl:'Offline'};
    if(a.kind==='matte'||a.kind==='bars'||a.kind==='tone')return{cls:'neu',lbl:'Generated'};
    return{cls:'ok',lbl:'Linked'};
  },
  binName(id){
    const p=Store.p;if(!p)return id;
    const b=p.bins.find(x=>x.id===id);
    if(!b)return id;
    if(!b.parentId)return b.name;
    const par=p.bins.find(x=>x.id===b.parentId);
    return (par?par.name+' / ':'')+b.name;
  },

  /* ---------------- folder tree (recursive, M3) ---------------- */
  renderTree(){
    const tr=$('#tree');
    if(!tr||!Store.p)return;
    tr.innerHTML='';
    const roots=Store.p.bins.filter(b=>!b.parentId);
    const render=(b,depth)=>{
      const kids=Store.p.bins.filter(c=>c.parentId===b.id);
      const row=document.createElement('div');
      row.className='tree-row'+(b.open?' open':'')+(S.folder===b.id?' sel':'')+(kids.length?'':' leaf');
      row.style.paddingLeft=(2+depth*13)+'px';
      row.dataset.bin=b.id;
      const assets=Model.binAssets(Store.p,b.id);
      const count=b.id==='sequences'?Store.p.sequences.length+assets.length:assets.length;
      const off=assets.filter(x=>x.offline).length;
      row.innerHTML='<span class="car"><i></i></span><span class="tn2">'+escHtml(b.name)+'</span>'+
        (off?'<span class="offn" data-tip="Offline media: '+off+'">'+off+'</span>':'')+
        '<span class="tc2">'+count+'</span>';
      row.querySelector('.car').addEventListener('click',e=>{
        e.stopPropagation();
        if(!kids.length)return;
        b.open=!b.open;
        Bin.renderTree();
      });
      row.addEventListener('click',()=>{
        S.folder=b.id;S.search='';
        const si=$('#bin-search');if(si)si.value='';
        const w=$('#bin-searchwrap');if(w)w.classList.remove('open');
        b.open=true;
        Bin.renderTree();Bin.render();
      });
      row.addEventListener('dblclick',e=>{
        e.stopPropagation();
        if(b.id==='sequences'){MediaOps.sequenceManager();return;}
        Bin.inlineRename(row,b);
      });
      row.addEventListener('contextmenu',e=>{
        e.preventDefault();
        Bin.openBinMenu(b,e.clientX,e.clientY);
      });
      tr.appendChild(row);
      if(b.open&&kids.length)kids.forEach(c=>render(c,depth+1));
    };
    roots.forEach(b=>render(b,0));
  },

  inlineRename(row,b){
    if(!b||!row||row.querySelector('.tree-rename'))return;
    const label=row.querySelector('.tn2');
    if(!label)return;
    const inp=document.createElement('input');
    inp.className='tree-rename';
    inp.value=b.name;
    inp.spellcheck=false;
    label.style.display='none';
    row.insertBefore(inp,label);
    inp.focus();inp.select();
    let done=false;
    const commit=ok=>{
      if(done)return;done=true;
      const v=inp.value.trim();
      inp.remove();
      label.style.display='';
      if(ok&&v&&v!==b.name)MediaOps.renameBin(b.id,v);
      else Bin.renderTree();
    };
    ['pointerdown','click','dblclick'].forEach(ev=>inp.addEventListener(ev,e=>e.stopPropagation()));
    inp.addEventListener('keydown',e=>{
      e.stopPropagation();
      if(e.key==='Enter')commit(true);
      else if(e.key==='Escape')commit(false);
    });
    inp.addEventListener('blur',()=>commit(true));
  },

  openBinMenu(b,x,y){
    const isSeqRoot=b.id==='sequences';
    const items=[];
    if(isSeqRoot){
      items.push({t:'New Sequence…',act:()=>MediaOps.newSequenceDialog()});
      items.push({t:'Sequence Manager…',act:()=>MediaOps.sequenceManager()});
    }else{
      items.push({t:'New Bin…',k:'Ctrl+/',act:()=>MediaOps.newBinDialog(b.id)});
      items.push({t:'Rename…',k:'F2',act:()=>{
        S.folder=b.id;Bin.renderTree();
        const row=$('#tree .tree-row[data-bin="'+b.id+'"]');
        if(row)Bin.inlineRename(row,b);
      }});
    }
    items.push({sep:1});
    items.push({t:'Import Media into Bin…',k:'Ctrl+I',act:()=>{
      Bin._importTarget=b.id;
      const i=$('#file-import');if(i)i.click();
    }});
    items.push({sep:1});
    items.push({t:'Delete Bin…',dis:!b.parentId,act:()=>MediaOps.deleteBinDialog(b)});
    openMenu(null,items,x,y);
  },

  /* ---------------- listing (filter + search + sequences) ---------------- */
  kindInFilter(kind){
    if(S.filter==='all')return true;
    if(S.filter==='video')return kind==='video';
    if(S.filter==='audio')return kind==='audio'||kind==='tone';
    return kind==='image'||kind==='matte'||kind==='bars';
  },
  currentItems(){
    if(!Store.p)return[];
    const p=Store.p;
    let assets=[];
    if(S.search){
      const q=S.search.toLowerCase();
      assets=Object.values(p.assets).filter(a=>
        a.name.toLowerCase().includes(q)||(a.fileName||'').toLowerCase().includes(q));
    }else{
      assets=Model.binAssets(p,S.folder);
    }
    if(S.filter!=='all')assets=assets.filter(a=>this.kindInFilter(a.kind));
    let seqs=[];
    if(S.filter==='all'){
      if(S.search){
        const q=S.search.toLowerCase();
        seqs=p.sequences.filter(s=>s.name.toLowerCase().includes(q));
      }else if(S.folder==='sequences'){
        seqs=p.sequences;
      }
    }
    const seqItems=seqs.map(s=>({
      id:s.id,name:s.name,kind:'sequence',duration:Model.seqDuration(s),
      binId:'sequences',meta:{width:p.settings.width,height:p.settings.height,fps:p.settings.fps},
      offline:false
    }));
    return assets.concat(seqItems);
  },

  renderFilters(){
    const el=$('#bin-filters');
    if(!el)return;
    el.innerHTML=this.FILTERS.map(f=>
      '<button class="chip'+(S.filter===f[0]?' on':'')+'" data-f="'+f[0]+'">'+f[1]+'</button>').join('');
  },

  render(){
    if(!Store.p)return;
    const list=this.currentItems();
    const {k,d}=S.sort;
    const fps=Store.fps();
    list.sort((a,b)=>{
      let r=0;
      if(k==='name')r=a.name.localeCompare(b.name);
      else if(k==='type')r=(this.TYLBL[a.kind]||'').localeCompare(this.TYLBL[b.kind]||'');
      else if(k==='dur')r=(a.duration||0)-(b.duration||0);
      else if(k==='fmt')r=this.fmtOf(a).localeCompare(this.fmtOf(b));
      else r=(this.statusOf(a).lbl).localeCompare(this.statusOf(b).lbl);
      return r*d;
    });
    $('#bin-path').textContent=S.search?('Search: "'+S.search+'"'):this.binName(S.folder);
    $('#bin-count').textContent=list.length+' item'+(list.length===1?'':'s');
    this.renderFilters();
    this.savePrefs();
    const wrap=$('#bin-rows');
    wrap.innerHTML='';
    if(!list.length){
      wrap.innerHTML='<div class="bin-empty">No media in this location.<br>Use Import (Ctrl+I) or drag files onto this panel.</div>';
      return;
    }
    list.forEach(a=>{
      const seq=a.kind==='sequence';
      const r=document.createElement('div');
      r.className='bin-row'+(S.selAsset===a.id?' sel':'');
      r.dataset.asset=a.id;
      const st=this.statusOf(a);
      r.innerHTML=
        '<span class="bn"><span class="tchip">'+this.TYCH[a.kind]+'</span><span>'+escHtml(a.name)+'</span></span>'+
        '<span class="bd">'+this.TYLBL[a.kind]+'</span>'+
        '<span class="bd">'+fmtTC(a.duration||0,fps)+'</span>'+
        '<span class="bf">'+this.fmtOf(a)+'</span>'+
        '<span><span class="badge '+st.cls+'">'+st.lbl+'</span></span>';
      r.addEventListener('click',()=>{
        S.selAsset=a.id;
        S.selClips.clear();
        Bin.render();
        Bus.emit('sel');
      });
      r.addEventListener('dblclick',()=>{
        if(seq){
          MediaOps.openSequence(a.id);
        }else{
          Source.open(a.id);
        }
      });
      r.addEventListener('contextmenu',e=>{
        e.preventDefault();
        S.selAsset=a.id;Bin.render();Bus.emit('sel');
        Bin.openAssetMenu(a,e.clientX,e.clientY);
      });
      /* pointer drag -> timeline, or -> bin tree row (move) */
      r.addEventListener('pointerdown',e=>{
        if(e.button!==0||seq)return;
        Bin.beginDrag(e,a);
      });
      wrap.appendChild(r);
    });
  },

  openAssetMenu(a,x,y){
    if(a.kind==='sequence'){
      const s=Store.p?Store.p.sequences.find(q=>q.id===a.id):null;
      openMenu(null,[
        {t:'Open in Timeline',act:()=>MediaOps.openSequence(a.id)},
        {sep:1},
        {t:'Rename…',k:'F2',dis:!s,act:()=>MediaOps.renameSequenceDialog(s)},
        {t:'Duplicate',dis:!s,act:()=>MediaOps.duplicateSequence(a.id)},
        {t:'Delete',dis:!s||Store.p.sequences.length<=1,act:()=>MediaOps.deleteSequenceDialog(s)},
        {sep:1},
        {t:'Sequence Manager…',act:()=>MediaOps.sequenceManager()}
      ],x,y);
      return;
    }
    const offline=!!a.offline&&!['matte','bars','tone'].includes(a.kind);
    openMenu(null,[
      {t:'Open in Source Monitor',dis:!!a.offline,act:()=>Source.open(a.id)},
      {t:'Insert at Playhead',k:',',dis:!!a.offline||!Store.seq,act:()=>Bin.insertAtPlayhead(a)},
      {t:'Overwrite onto First Free Slot',dis:!!a.offline||!Store.seq,act:()=>Bin.insertAtPlayhead(a,true)},
      {sep:1},
      {t:'Rename…',k:'F2',act:()=>MediaOps.renameAssetDialog(a)},
      {t:'Move to Bin…',act:()=>MediaOps.moveAssetsToBinDialog(a)},
      {t:'Relink Media…',dis:!offline,act:()=>Bin.relinkAsk(a)},
      {sep:1},
      {t:'Remove from Project',act:()=>MediaOps.removeAssetDialog(a)}
    ],x,y);
  },
  insertAtPlayhead(a,findGap){
    /* replaced by the M2 override in 12b-js-edit (EditOps.placeAsset) */
    const s=Store.seq;if(!s||a.offline)return;
    const kind=Model.trackKindFor(a);
    const tracks=s.tracks.filter(t=>t.kind===kind&&!t.locked);
    const track=tracks[0];
    if(!track){action('No unlocked '+kind+' track');return;}
    const dur=Math.min(a.duration||5,a.kind==='image'?Store.p.settings.stillDuration:1e9);
    const start=Model.freeSlot(track,findGap?0:Playback.t,dur);
    const clip=Model.newClip(Store.p,a,track,start,0,dur);
    cmdAddClips([{clip}]);
    Playback.seek(start);
    action('Inserted '+a.name+' at '+fmtTC(start,Store.fps()));
  },
  hasOffline(){
    if(!Store.p)return false;
    return Object.values(Store.p.assets).some(a=>a.offline);
  },
  relinkAsk(a){
    const inp=$('#file-relink');
    if(!inp)return;
    inp.value='';
    inp.onchange=()=>{
      const f=inp.files&&inp.files[0];
      if(f)Media.relink(a.id,f);
    };
    inp.click();
  },

  /* ---------------- view-state persistence (M3) ---------------- */
  savePrefs(){
    try{
      localStorage.setItem(this.PREFKEY,JSON.stringify(
        {folder:S.folder,search:S.search,sort:S.sort,filter:S.filter}));
    }catch(e){}
  },
  applyPrefs(raw){
    /* raw: prefs captured BEFORE a project load (the load's own renders
       would otherwise overwrite the stored state before we can read it) */
    try{
      const o=JSON.parse(raw!=null?raw:localStorage.getItem(this.PREFKEY))||{};
      if(o.folder&&Store.p&&Store.p.bins.some(b=>b.id===o.folder))S.folder=o.folder;
      if(typeof o.search==='string'&&o.search){
        S.search=o.search;
        const si=$('#bin-search'),w=$('#bin-searchwrap');
        if(si)si.value=o.search;
        if(w)w.classList.add('open');
      }
      if(o.sort&&o.sort.k)S.sort=o.sort;
      if(o.filter&&this.FILTERS.some(f=>f[0]===o.filter))S.filter=o.filter;
    }catch(e){}
    $$('#bin-head .th').forEach(x=>{
      x.classList.remove('asc','desc');
      if(x.dataset.k===S.sort.k)x.classList.add(S.sort.d===1?'asc':'desc');
    });
    this.renderTree();
    this.render();
  },

  /* ---------------- drag: to timeline, or onto a tree row (move) ---------------- */
  beginDrag(e,a){
    if(S.dragging)return;
    const start={x:e.clientX,y:e.clientY};
    let ghost=null,targets=null,treeRows=null,treeHit=null;
    const overTree=ev=>{
      const els=document.elementsFromPoint(ev.clientX,ev.clientY);
      const t=els.find(el=>el.classList&&el.classList.contains('tree-row'));
      if(!t)return null;
      const bid=t.dataset.bin;
      if(!bid||bid===a.binId)return null;
      return t;
    };
    const move=ev=>{
      if(!ghost&&Math.hypot(ev.clientX-start.x,ev.clientY-start.y)>5){
        ghost=$('#drag-ghost');
        if(!ghost)return;
        ghost.querySelector('.dg-name').textContent=a.name;
        ghost.querySelector('.tchip').textContent=Bin.TYCH[a.kind];
        ghost.style.display='flex';
        $('#sc-root').classList.add('dragging');
        S.dragging={assetId:a.id};
        targets=$$('#tl-tracks .track');
        treeRows=$$('#tree .tree-row');
      }
      if(ghost){
        ghost.style.left=(ev.clientX+12)+'px';
        ghost.style.top=(ev.clientY+10)+'px';
        treeHit=overTree(ev);
        treeRows.forEach(r=>r.classList.toggle('droptree',r===treeHit));
        if(treeHit){
          ghost.querySelector('.dg-name').textContent='Move to '+Bin.binName(treeHit.dataset.bin);
          targets.forEach(t=>t.classList.remove('drop-ok','drop-no'));
        }else{
          ghost.querySelector('.dg-name').textContent=a.name;
          targets.forEach(t=>Bin.markDrop(t,ev,a));
        }
      }
    };
    const up=ev=>{
      document.removeEventListener('pointermove',move);
      document.removeEventListener('pointerup',up);
      if(ghost){
        ghost.style.display='none';
        $('#sc-root').classList.remove('dragging');
        S.dragging=null;
        $$('#tl-tracks .track').forEach(t=>t.classList.remove('drop-ok','drop-no'));
        $$('#tree .tree-row').forEach(r=>r.classList.remove('droptree'));
        const th=overTree(ev);
        if(th){MediaOps.moveAssets([a.id],th.dataset.bin);return;}
        const hit=Bin.dropTarget(ev,a);
        if(hit)TL.dropAsset(a,hit.track,hit.x);
      }
    };
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',up);
  },
  cancelDrag(){/* pointer listeners clean themselves up on pointerup */},
  dropTarget(ev,a){
    const els=document.elementsFromPoint(ev.clientX,ev.clientY);
    const track=els.find(el=>el.classList&&el.classList.contains('track'));
    if(!track)return null;
    const kind=Model.trackKindFor(a);
    const tr=Store.seq?Model.trackFor(Store.seq,track.dataset.track):null;
    if(!tr||tr.kind!==kind||tr.locked)return null;
    return {track:tr,x:ev.clientX};
  },
  markDrop(trackEl,ev,a){
    const els=document.elementsFromPoint(ev.clientX,ev.clientY);
    const hit=els.includes(trackEl);
    if(!hit){trackEl.classList.remove('drop-ok','drop-no');return;}
    const kind=Model.trackKindFor(a);
    const tr=Store.seq?Model.trackFor(Store.seq,trackEl.dataset.track):null;
    const ok=tr&&tr.kind===kind&&!tr.locked;
    trackEl.classList.toggle('drop-ok',!!ok);
    trackEl.classList.toggle('drop-no',!ok);
  },

  /* ---------------- wiring ---------------- */
  bind(){
    const imp=$('#btn-import'),inp=$('#file-import');
    if(imp)imp.addEventListener('click',()=>{Bin._importTarget=null;inp&&inp.click();});
    if(inp){
      inp.addEventListener('change',()=>{
        if(inp.files&&inp.files.length){
          Media.importFiles([...inp.files],Bin._importTarget||undefined);
        }
        Bin._importTarget=null;
        inp.value='';
      });
    }
    const nb=$('#btn-newbin');
    if(nb)nb.addEventListener('click',()=>Bin.newBin());
    /* drop files onto the bin panel: onto a tree row -> that bin, else default routing */
    const panel=$('#panel-bin');
    if(panel){
      panel.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';});
      panel.addEventListener('drop',e=>{
        e.preventDefault();
        if(!(e.dataTransfer&&e.dataTransfer.files.length))return;
        const els=document.elementsFromPoint(e.clientX,e.clientY);
        const tRow=els.find(el=>el.classList&&el.classList.contains('tree-row'));
        Media.importFiles([...e.dataTransfer.files],tRow?tRow.dataset.bin:undefined);
      });
    }
    const si=$('#bin-search-ic');
    if(si)si.addEventListener('click',()=>{
      const w=$('#bin-searchwrap');
      w.classList.toggle('open');
      if(w.classList.contains('open'))$('#bin-search').focus();
      else{S.search='';$('#bin-search').value='';Bin.render();}
    });
    const sin=$('#bin-search');
    if(sin)sin.addEventListener('input',e=>{S.search=e.target.value.trim();Bin.render();});
    const bf=$('#bin-filters');
    if(bf)bf.addEventListener('click',e=>{
      const c=e.target.closest('.chip');
      if(!c)return;
      S.filter=c.dataset.f;
      Bin.render();
    });
    $$('#bin-head .th').forEach(h=>h.addEventListener('click',()=>{
      const k=h.dataset.k;
      if(S.sort.k===k)S.sort.d*=-1;else S.sort={k,d:1};
      $$('#bin-head .th').forEach(x=>{
        x.classList.remove('asc','desc');
        if(x.dataset.k===S.sort.k)x.classList.add(S.sort.d===1?'asc':'desc');
      });
      Bin.render();
    }));
  }
};
</script>
