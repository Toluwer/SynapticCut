<style>
/* ================= MONITOR ================= */
#mon-tabs{display:flex;gap:2px;align-items:center}
.mtab{height:19px;padding:0 10px;display:flex;align-items:center;border:1px solid transparent;border-radius:2px;font-size:10.5px;color:var(--txt-2)}
.mtab:hover{background:var(--bg-hover);color:var(--txt)}
.mtab.on{background:var(--bg-active);border-color:var(--line-soft);color:#dce9f6}
.mtab .mdot{display:none}
.mon-stage{
  flex:1;min-height:0;position:relative;background:#0a0b0c;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.sc-frame{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.sc-frame svg.scene{width:100%;height:100%;display:block}
.ov{position:absolute;font:10px var(--mono);color:rgba(200,210,220,.55);pointer-events:none}
.ov.tl{top:6px;left:8px}
.ov.br{bottom:6px;right:8px;color:var(--tc);background:rgba(8,9,10,.55);padding:1px 5px;border-radius:2px}
.ov.bl{bottom:6px;left:8px}
#safe-ov{position:absolute;inset:0;display:none}
#safe-ov.on{display:block}
#safe-ov .sa1,#safe-ov .sa2{position:absolute;border:1px solid rgba(240,245,250,.30)}
#safe-ov .sa1{inset:5%}
#safe-ov .sa2{inset:10%;border-style:dashed;border-color:rgba(240,245,250,.20)}
.src-empty{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:9px;
}
.mon-stage.src .src-empty{display:flex}
.mon-stage.src .sc-frame{display:none}
.src-empty .se-t{font-size:11.5px;color:var(--txt-2)}
.src-empty .se-s{font-size:10px;color:var(--txt-3)}
.mon-controls{
  height:34px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;
  background:var(--bg-panel);border-top:1px solid var(--line-outer);
}
.mon-tc{font:11.5px var(--mono);color:var(--tc);width:88px;flex:none}
.mon-center{flex:1;display:flex;align-items:center;justify-content:center;gap:3px}
.tc-btn{width:26px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:2px;color:var(--txt-2)}
.tc-btn:hover{color:var(--txt);background:var(--bg-hover)}
.tc-btn.play{width:32px}
.tc-btn.play.pressed{background:var(--accent-soft);border-color:#3e5f82;color:#9cc6ee}
.mon-right{display:flex;align-items:center;gap:4px;flex:none}
.mon-loop{margin-right:2px}

/* ================= MEDIA BIN (Project) ================= */
.bin-searchwrap{display:flex;align-items:center;overflow:hidden;width:22px;transition:width .18s;flex:none}
.bin-searchwrap.open{width:148px}
#bin-search{
  width:100%;height:19px;background:var(--bg-input);border:1px solid var(--line-soft);border-radius:2px;
  color:var(--txt);font-size:10.5px;padding:0 6px;display:none;
}
.bin-searchwrap.open #bin-search{display:block}
.bin-searchwrap:not(.open) .icb{margin-left:auto}
.bin-body{flex:1;min-height:0;display:flex}
.bin-tree{
  width:158px;flex:none;overflow-y:auto;background:var(--bg-body);
  border-right:1px solid var(--line-outer);padding:4px 0;
}
.tree-row{display:flex;align-items:center;height:22px;padding:0 6px 0 2px;gap:4px;font-size:10.5px;color:var(--txt-2);border-radius:2px}
.tree-row:hover{background:var(--bg-hover)}
.tree-row.sel{background:var(--accent-soft);color:#cfe2f5}
.tree-row .car{width:12px;height:12px;flex:none;display:flex;align-items:center;justify-content:center}
.tree-row .car i{
  width:0;height:0;border-left:4px solid #767e85;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;
  transition:transform .12s;
}
.tree-row.open>.car i{transform:rotate(90deg)}
.tree-row .tn2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-row .tc2{margin-left:auto;color:var(--txt-3);font:9.5px var(--mono);padding-left:4px}
.bin-main{flex:1;min-width:0;display:flex;flex-direction:column}
.bin-strip{
  height:24px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px;
  background:var(--bg-panel);border-bottom:1px solid var(--line-outer);
  font-size:10px;color:var(--txt-3);
}
.bin-strip .bp{color:var(--txt-2)}
.bin-list{flex:1;min-height:0;overflow-y:auto;background:var(--bg-body)}
.bin-row{display:grid;grid-template-columns:minmax(120px,1.7fr) 74px 86px minmax(110px,1.25fr) 74px;align-items:center;height:24px;padding:0 6px 0 4px;border-bottom:1px solid #1e2124}
.bin-row:hover{background:#202429}
.bin-row.sel{background:rgba(74,144,217,.14);box-shadow:inset 2px 0 0 var(--accent-line)}
.bin-row .bn{display:flex;align-items:center;gap:6px;min-width:0}
.bin-row .bn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.bin-row.sel .bn span{color:#dbe8f6}
.tchip{width:15px;height:15px;flex:none;display:flex;align-items:center;justify-content:center;background:#2d3236;border:1px solid #3d4348;border-radius:2px;font:600 8.5px var(--mono);color:#a8b2ba}
.bin-row .bd{font:9.5px var(--mono);color:var(--txt-2)}
.bin-row .bf{font-size:9.5px;color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.bin-head{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:minmax(120px,1.7fr) 74px 86px minmax(110px,1.25fr) 74px;height:22px;background:var(--bg-head);border-bottom:1px solid var(--line-outer);align-items:center;padding:0 6px 0 4px}
.th{display:flex;align-items:center;gap:4px;font-size:9.5px;letter-spacing:.3px;text-transform:uppercase;color:var(--txt-3);height:100%;border-right:1px solid var(--line-soft)}
.th:last-child{border-right:0}
.th:hover{color:var(--txt-2);background:var(--bg-hover)}
.th .si{width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-top:4px solid var(--accent-line);display:none}
.th.asc .si{display:block}
.th.desc .si{display:block;transform:rotate(180deg)}
.bin-empty{padding:18px 12px;font-size:10.5px;color:var(--txt-3)}

/* ================= PROPERTIES / EFFECT CONTROLS ================= */
.sec{border-bottom:1px solid #1f2225}
.sec-h{display:flex;align-items:center;gap:6px;height:23px;padding:0 8px;background:#22262a;color:var(--txt-2);font-size:10.5px;font-weight:600}
.sec-h:hover{background:var(--bg-hover)}
.sec-h .car{width:11px;height:11px;flex:none;display:flex;align-items:center;justify-content:center}
.sec-h .car i{width:0;height:0;border-left:3.5px solid #767e85;border-top:3px solid transparent;border-bottom:3px solid transparent;transition:transform .12s}
.sec.open>.sec-h .car i{transform:rotate(90deg)}
.sec-b{display:none;padding:5px 8px 8px}
.sec.open>.sec-b{display:block}
.prow{display:flex;align-items:center;gap:6px;height:24px}
.prow .pl{flex:none;width:76px;font-size:10.5px;color:var(--txt-2);display:flex;align-items:center;gap:5px}
.prow .pl .kfn{display:flex;gap:1px;align-items:center}
.prow:hover .pl{color:var(--txt)}
.chkrow{display:flex;align-items:center;gap:16px;height:22px;flex-wrap:wrap}
.props-info{padding:8px 9px;font:9.5px var(--mono);color:var(--txt-3);line-height:1.7}
.props-info b{color:var(--txt-2);font-weight:500}
.ph-chip{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:9.5px var(--mono);color:var(--tc)}
.mbtnrow{display:flex;align-items:center;gap:6px;height:24px}
.mbtnrow .pl{width:76px;flex:none;font-size:10.5px;color:var(--txt-2)}

/* ================= EFFECTS BROWSER ================= */
#fx-search{
  width:100%;height:20px;background:var(--bg-input);border:1px solid var(--line-soft);border-radius:2px;
  color:var(--txt);font-size:10.5px;padding:0 6px 0 22px;
}
.fx-searchwrap{position:relative;padding:5px 6px;border-bottom:1px solid var(--line-outer);flex:none}
.fx-searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--txt-3);pointer-events:none}
.fx-body{flex:1;min-height:0;overflow-y:auto;background:var(--bg-body);padding:2px 0 8px}
.fxg-h{display:flex;align-items:center;height:21px;padding:0 7px;gap:5px;color:var(--txt-2);font-size:10.5px;font-weight:600}
.fxg-h:hover{background:var(--bg-hover)}
.fxg-h .car{width:10px;height:10px;display:flex;align-items:center;justify-content:center}
.fxg-h .car i{width:0;height:0;border-left:3.5px solid #767e85;border-top:3px solid transparent;border-bottom:3px solid transparent;transition:transform .12s}
.fxg.open>.fxg-h .car i{transform:rotate(90deg)}
.fxg-h .cnt{margin-left:auto;font:9.5px var(--mono);color:var(--txt-3)}
.fxg-rows{display:none}
.fxg.open>.fxg-rows{display:block}
.fxr{display:flex;align-items:center;gap:7px;height:20px;padding:0 8px 0 22px;color:var(--txt-2);font-size:10.5px}
.fxr:hover{background:#202429;color:var(--txt)}
.fxr.sel{background:rgba(74,144,217,.16);color:#dbe8f6;box-shadow:inset 2px 0 0 var(--accent-line)}
.fxr .fxc{width:17px;height:13px;flex:none;display:flex;align-items:center;justify-content:center;background:#2b3034;border:1px solid #3c4247;border-radius:2px;font:600 7.5px var(--mono);color:#9aa8b5}
.fxr .fxc.aud{color:#8fbb9f}
.fxr .grip{margin-left:auto;display:flex;gap:2px;opacity:0;padding:0 2px}
.fxr:hover .grip{opacity:.55}
.fxr .grip i{width:2px;height:2px;background:#aab3bb;border-radius:1px}

/* ================= AUDIO MIXER ================= */
.mix-body{flex:1;min-height:0;display:flex;background:var(--bg-body);overflow-x:auto}
.mix-scale{width:34px;flex:none;display:flex;flex-direction:column;justify-content:space-between;padding:26px 2px 40px 4px;font:8.5px var(--mono);color:var(--txt-3);text-align:right;border-right:1px solid #1f2225}
.mix-strips{flex:1;display:flex;justify-content:space-around;gap:2px;padding:0 4px;min-width:0}
.strip{flex:1;min-width:86px;display:flex;flex-direction:column;align-items:center;padding:5px 2px 7px;border-right:1px solid #1f2225}
.strip:last-child{border-right:0}
.strip.master{background:#1c1f22}
.strip-nm{font-size:10px;color:var(--txt);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.strip-id{font:9px var(--mono);color:var(--txt-3);margin-top:1px}
.strip-mid{flex:1;display:flex;gap:8px;align-items:stretch;padding:6px 0 4px;min-height:0}
.meter{width:9px;flex:none;display:flex;gap:2px}
.meter .mb{flex:1;width:3px;background:#121416;border:1px solid #2a2e32;border-radius:1px;position:relative;overflow:hidden}
.meter .mb i{position:absolute;left:0;right:0;bottom:0;background:var(--ok)}
.meter .mb i::before{content:"";position:absolute;left:0;right:0;bottom:0;height:88%;background:var(--ok)}
.meter .mb i::after{content:"";position:absolute;left:0;right:0;bottom:88%;height:12%;background:#d3bd52}
.meter .mb .peak{position:absolute;left:-1px;right:-1px;height:1px;background:#e8edf1;bottom:80%}
.faderwrap{display:flex;flex-direction:column;align-items:center;min-height:0;flex:1}
.fader{flex:1;width:5px;background:#121416;border:1px solid #2a2e32;border-radius:2px;position:relative;margin-top:4px;margin-bottom:4px}
.fader .th{
  position:absolute;left:50%;transform:translateX(-50%);width:26px;height:15px;background:#cfd6db;
  border:1px solid #eef2f5;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.5);
}
.fader .th::after{content:"";position:absolute;left:3px;right:3px;top:6px;height:1.5px;background:#5b646c}
.strip-db{font:9.5px var(--mono);color:var(--txt-2);margin-top:4px}
.strip-btns{display:flex;gap:4px;margin-top:5px}
.sbtn{width:20px;height:17px;display:flex;align-items:center;justify-content:center;font:600 9px var(--mono);color:var(--txt-3);border:1px solid var(--line-soft);border-radius:2px;background:#24282b}
.sbtn:hover{color:var(--txt)}
.sbtn.on{color:#f0d7a4;background:#5a4a2a;border-color:#6e5a34}
.sbtn.on.s{color:#bfe3c8;background:#2c4a35;border-color:#3d6448}

/* ================= COLOR / LUMETRI ================= */
.ctabs{display:flex;gap:2px;padding:5px 8px;border-bottom:1px solid var(--line-outer);flex:none}
.ctab{height:20px;padding:0 9px;display:flex;align-items:center;font-size:10px;color:var(--txt-3);border:1px solid transparent;border-radius:2px}
.ctab:hover{color:var(--txt-2);background:var(--bg-hover)}
.ctab.on{color:#dce9f6;background:var(--bg-active);border-color:var(--line-soft)}
.col-body{flex:1;min-height:0;overflow-y:auto;padding:8px 10px 14px}
.wheels{display:flex;gap:10px;justify-content:space-around;padding:2px 0 6px}
.wheel-col{flex:1;min-width:130px;display:flex;flex-direction:column;align-items:center}
.wheel-t{font-size:10px;font-weight:600;color:var(--txt-2);letter-spacing:.4px;text-transform:uppercase}
.wheel{position:relative;width:74px;height:74px;border-radius:50%;margin:8px 0 9px;flex:none;
  background:conic-gradient(from 100deg,#b8564f,#b89d4f,#79a85f,#4f9c99,#4f6bb8,#8f4fb8,#b8564f);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),0 0 0 1px #121416;
}
.wheel::before{content:"";position:absolute;inset:17px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#40454b 0%,#25282c 58%,#191c1f 100%)}
.wknob{position:absolute;width:13px;height:13px;border-radius:50%;background:#d9dee3;border:1px solid #f4f7fa;box-shadow:0 1px 3px rgba(0,0,0,.65);z-index:2}
.wrow{display:flex;align-items:center;gap:6px;width:100%;height:22px;padding:0 1px}
.wrow .wl{flex:none;width:26px;font-size:9.5px;color:var(--txt-3)}
.wrow .num{width:40px;height:17px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;margin-top:4px}
.cgrid .prow .pl{width:64px}

/* ================= TIMELINE ================= */
#panel-timeline{background:var(--bg-panel)}
.tl-bar{height:28px;flex:none;display:flex;align-items:center;gap:5px;padding:0 7px;background:var(--bg-head);border-bottom:1px solid var(--line-outer)}
.tlc-box{
  width:86px;height:20px;display:flex;align-items:center;justify-content:center;
  background:var(--bg-input);border:1px solid var(--line-soft);border-radius:2px;
  font:10.5px var(--mono);color:var(--tc);flex:none;
}
.tlt{width:24px;height:21px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:2px;color:var(--txt-2)}
.tlt:hover{background:var(--bg-hover);color:var(--txt);border-color:var(--line-soft)}
.tlt.on{background:var(--accent-soft);border-color:#3e5f82;color:#9cc6ee}
.tl-bar .tl-right{margin-left:auto;display:flex;align-items:center;gap:5px}
.tl-zlbl{font-size:9.5px;color:var(--txt-3)}
.zbtn{width:17px;height:17px;border:1px solid var(--line-soft);border-radius:2px;background:#2c3033;color:var(--txt-2);font:11px var(--mono);display:flex;align-items:center;justify-content:center}
.zbtn:hover{background:var(--bg-hover);color:var(--txt)}
#tl-zoom{width:96px}
.tl-body{flex:1;min-height:0;display:flex;background:var(--bg-body);overflow:hidden}
.tl-headers{width:212px;flex:none;background:var(--bg-panel);border-right:1px solid var(--line-outer);overflow:hidden}
.th-sp{height:24px;background:var(--bg-head);border-bottom:1px solid var(--line-soft)}
.hrow{display:flex;align-items:center;gap:4px;padding:0 7px 0 6px;background:#24272b;border-bottom:1px solid var(--line)}
.hrow.a{background:#222629;border-bottom-color:#0d0e10}
.hrow.a.first{border-top:2px solid #0a0b0c}
.hrow .tn{font:600 9.5px var(--mono);color:var(--txt-2);flex:none}
.hrow .tn2{font-size:9.5px;color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .sp{flex:1}
.thb{width:18px;height:16px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:2px;color:var(--txt-3)}
.thb:hover{color:var(--txt);background:var(--bg-hover)}
.thb.on{color:#d3dce4;background:var(--bg-active);border-color:var(--line-soft)}
.thb.on.warn{color:#f0d7a4;background:#5a4a2a;border-color:#6e5a34}
.thb .bl{font:700 8.5px var(--mono)}
.tl-scroll{flex:1;min-width:0;overflow-x:auto;overflow-y:auto;position:relative}
.tl-content{position:relative;min-width:100%}
.tl-ruler{position:relative;height:24px;background:var(--bg-head);border-bottom:1px solid var(--line-soft);overflow:hidden}
.tick{position:absolute;bottom:0;width:1px;height:6px;background:#4a5055}
.tick.maj{height:11px;background:#727a80}
.tlabel{position:absolute;bottom:12px;transform:translateX(4px);font:9px var(--mono);color:var(--txt-3)}
.tmark{position:absolute;top:15px;width:7px;height:7px;transform:rotate(45deg) translateX(-2px);background:#4f8f63;border:1px solid #6db483;z-index:3}
.tl-tracks{position:relative}
.track{position:relative;border-bottom:1px solid var(--line);background:#1a1d1f}
.track.a{background:#191d1c}
.track.a.first{border-top:2px solid #0a0b0c}
.clip{position:absolute;top:1px;bottom:1px;border:1px solid;border-radius:2px;overflow:hidden;font-size:9.5px;line-height:1.3}
.clip.v{background:var(--clip-v);border-color:var(--clip-v-b);color:var(--clip-v-t)}
.clip.a{background:var(--clip-a);border-color:var(--clip-a-b);color:var(--clip-a-t)}
.clip .cn{
  display:block;background:rgba(0,0,0,.24);padding:1px 5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-height:13px;
}
.clip .cv{position:absolute;inset:13px 0 0 0;opacity:.5;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 1px,transparent 1px 7px)}
.clip.sel{outline:1px solid #d9e8f8;outline-offset:-1px;filter:brightness(1.18)}
.clip .fxd{position:absolute;right:3px;bottom:2px;font:600 7.5px var(--mono);color:#cfe0f2;background:rgba(20,30,44,.55);border:1px solid rgba(150,180,210,.35);border-radius:2px;padding:0 3px}
.clip svg.wv{position:absolute;inset:12px 0 0 0;width:100%;height:calc(100% - 12px)}
.tl-ph{position:absolute;top:0;bottom:0;width:1px;background:var(--accent-line);z-index:6}
.tl-ph .ph-grip{
  position:absolute;left:-5.5px;top:11px;width:12px;height:12px;background:var(--accent-line);
  clip-path:polygon(50% 0,100% 40%,100% 100%,0 100%,0 40%);
}
.tl-ph .ph-grip::after{content:"";position:absolute;left:5.5px;top:3px;bottom:2px;width:1px;background:rgba(8,9,10,.4)}
.tl-empty-hint{padding:8px 10px;font-size:10px;color:var(--txt-3)}
</style>
</head>
